services:
  - type: web
    name: skillverse-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run backend:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXPRESS_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPRESS_API_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
